name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Zowe CLI
        run: npm install -g @zowe/cli

      - name: Setup Mainframe Environment and Upload COBOL Check
        env:
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_OPT_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_OPT_PORT }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_OPT_USER }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_OPT_PASSWORD }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: "false"
        run: |
          chmod +x .github/scripts/zowe_operations.sh
          ./.github/scripts/zowe_operations.sh
          # Aqui você pode adicionar os comandos para rodar o cobol-check
          echo "Running COBOL Check..."
